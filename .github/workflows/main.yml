name: Windows Test VM

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Informações do sistema
        shell: powershell
        run: |
          Write-Host "Sistema:"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "`nCPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "`nRAM:"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

      - name: Testar ambiente
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\test" -Force
          "Ambiente Windows funcionando." |
            Out-File "$env:GITHUB_WORKSPACE\test\resultado.txt"

      - name: Mostrar resultado
        shell: powershell
        run: |
          Get-Content "$env:GITHUB_WORKSPACE\test\resultado.txt"
