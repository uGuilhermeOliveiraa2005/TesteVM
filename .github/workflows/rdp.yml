name: GitHub RDP Cloud VM

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Cole aqui o código do Chrome Remote Desktop (Debian Linux)'
        required: true
        type: string
      pin_code:
        description: 'Digite um PIN numérico de 6 dígitos'
        required: true
        default: '123456'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar e Limpar Sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget curl unzip net-tools xfce4 xfce4-terminal dbus-x11

      - name: Instalar Chrome Remote Desktop
        run: |
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg -i chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y
          rm -f chrome-remote-desktop_current_amd64.deb

      - name: Configurar Sessão de Alto Desempenho
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

      - name: Instalar Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb

      - name: Configurar Usuário e Autenticação
        run: |
          sudo adduser runner chrome-remote-desktop || true
          ${{ inputs.crd_code }} --pin=${{ inputs.pin_code }}

      - name: Manter a VM Ativa
        run: |
          echo "===================================================="
          echo " RDP Ativo com Sucesso!"
          echo " Acesse via: https://remotedesktop.google.com/access"
          echo "===================================================="
          sleep 21600
